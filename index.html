  <style>
    @media print {
      body * { visibility: hidden; }
      #resume-preview, #resume-preview * { visibility: visible; }
      #resume-preview { 
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; box-shadow: none; transform: none !important; 
      }
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    
    /* Strict Pure A4 Dimensions */
    .a4-paper {
      width: 210mm;
      min-height: 297mm;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      margin: 0 auto;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Standard 2x2 ID Photo */
#resume-preview img {
  width: 50.8mm !important;
  height: 50.8mm !important;
  object-fit: cover;
}

    /* Screen Preview Container */
    .preview-viewport {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 2rem;
    }

    /* Screen Scale Only */
    .a4-screen-scaled {
  transform: scale(0.70);
  transform-origin: top center;
  margin-bottom: -90mm;
}

@media (min-width: 1536px) {
  .a4-screen-scaled {
    transform: scale(0.80);
    margin-bottom: -60mm;
  }
}
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white font-black px-3 py-1 rounded-lg text-xl tracking-wider">100</div>
        <div>
          <h1 class="font-extrabold text-xl leading-none">Resumify<span class="text-blue-400">.ph</span></h1>
          <p class="text-xs text-slate-400">100 Dynamic A4 Layouts & Colors</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="triggerDownload()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center shadow-md">
          <i class="fa-solid fa-download mr-2"></i> Download A4 PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Main 3-Column Workspace -->
  <main class="max-w-[1600px] mx-auto px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 w-full">
    
    <!-- LEFT COLUMN: Form Editor (4 cols) -->
    <div class="lg:col-span-4 space-y-5">
      
      <!-- Personal Details -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
          <span class="flex items-center"><i class="fa-solid fa-user text-blue-600 mr-2"></i> Personal Details</span>
        </h2>
        <div class="space-y-2.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
            <input type="text" id="fullName" value="Elena Rostova" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Target Job Title</label>
            <input type="text" id="jobTitle" value="Customer Operations Manager" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
              <input type="email" id="email" value="elena.rostova@example.com" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Phone</label>
              <input type="text" id="phone" value="+63 917 888 2345" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Location</label>
            <input type="text" id="address" value="Quezon City, Metro Manila" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Profile Photo</label>
            <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)" class="text-xs w-full p-1 border border-slate-300 rounded">
          </div>
        </div>

        <!-- Bio-Data Extra Fields -->
        <div id="biodata-extra-fields" class="mt-3 pt-3 border-t border-slate-200">
          <p class="text-xs font-bold text-amber-800 mb-2">Pinoy Bio-Data Fields (Template #51-60):</p>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-600">Civil Status</label>
              <input type="text" id="civilStatus" value="Single" oninput="updatePreview()" class="w-full text-xs p-1.5 border border-slate-300 rounded">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-600">Date of Birth</label>
              <input type="text" id="dob" value="August 14, 1993" oninput="updatePreview()" class="w-full text-xs p-1.5 border border-slate-300 rounded">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-600">Religion</label>
              <input type="text" id="religion" value="Roman Catholic" oninput="updatePreview()" class="w-full text-xs p-1.5 border border-slate-300 rounded">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-600">Height / Weight</label>
              <input type="text" id="heightWeight" value="5'5'' / 58 kg" oninput="updatePreview()" class="w-full text-xs p-1.5 border border-slate-300 rounded">
            </div>
          </div>
        </div>
      </div>

      <!-- Professional Summary -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-sm mb-2 flex items-center">
          <i class="fa-solid fa-pen-nib text-blue-600 mr-2"></i> Professional Summary
        </h2>
        <textarea id="summary" rows="3" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">BPO Operations Team Lead with 7+ years managing Tier-3 US Telco and FinTech accounts. Specialized in CSAT enhancement, SLA management, and workforce scheduling.</textarea>
      </div>

      <!-- Experience -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-800 text-sm flex items-center">
            <i class="fa-solid fa-briefcase text-blue-600 mr-2"></i> Work Experience
          </h2>
          <button onclick="addExperienceBlock()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2 py-1 rounded border border-blue-200">
            <i class="fa-solid fa-plus mr-1"></i> Add Position
          </button>
        </div>

        <div id="experience-container" class="space-y-3">
          <div class="exp-card border border-slate-200 p-2.5 rounded-lg bg-slate-50 space-y-1.5">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" class="exp-company text-xs p-1 border border-slate-300 rounded" value="Concentric BPO Services" placeholder="Company" oninput="updatePreview()">
              <input type="text" class="exp-role text-xs p-1 border border-slate-300 rounded" value="Team Lead - Technical Support" placeholder="Role" oninput="updatePreview()">
            </div>
            <input type="text" class="exp-dates text-xs p-1 border border-slate-300 rounded w-full" value="2021 - Present" placeholder="Dates" oninput="updatePreview()">
            <textarea class="exp-bullets text-xs p-1 border border-slate-300 rounded w-full" rows="2" placeholder="Responsibilities" oninput="updatePreview()">Maintained 96.5% CSAT score across 25 customer support agents.
Reduced First Contact Resolution (FCR) turnaround time by 32% using CRM workflows.</textarea>
          </div>

          <div class="exp-card border border-slate-200 p-2.5 rounded-lg bg-slate-50 space-y-1.5">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" class="exp-company text-xs p-1 border border-slate-300 rounded" value="Teleperformance PH" placeholder="Company" oninput="updatePreview()">
              <input type="text" class="exp-role text-xs p-1 border border-slate-300 rounded" value="Senior Customer Care Agent" placeholder="Role" oninput="updatePreview()">
            </div>
            <input type="text" class="exp-dates text-xs p-1 border border-slate-300 rounded w-full" value="2018 - 2021" placeholder="Dates" oninput="updatePreview()">
            <textarea class="exp-bullets text-xs p-1 border border-slate-300 rounded w-full" rows="2" placeholder="Responsibilities" oninput="updatePreview()">Awarded Agent of the Quarter twice for exceeding escalation containment goals.
Handled inbound billing and tech inquiries for North American telecom clients.</textarea>
          </div>
        </div>
      </div>

      <!-- Education -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-800 text-sm flex items-center">
            <i class="fa-solid fa-graduation-cap text-blue-600 mr-2"></i> Education
          </h2>
          <button onclick="addEducationBlock()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2 py-1 rounded border border-blue-200">
            <i class="fa-solid fa-plus mr-1"></i> Add Education
          </button>
        </div>

        <div id="education-container" class="space-y-3">
          <div class="edu-card border border-slate-200 p-2.5 rounded-lg bg-slate-50 space-y-1.5">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" class="edu-school text-xs p-1 border border-slate-300 rounded" value="Polytechnic University of the Philippines" placeholder="School / University" oninput="updatePreview()">
              <input type="text" class="edu-degree text-xs p-1 border border-slate-300 rounded" value="BS Business Administration" placeholder="Degree" oninput="updatePreview()">
            </div>
            <input type="text" class="edu-dates text-xs p-1 border border-slate-300 rounded w-full" value="2014 - 2018" placeholder="Graduation Year / Dates" oninput="updatePreview()">
          </div>
        </div>
      </div>

      <!-- Certifications -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-sm mb-2 flex items-center">
          <i class="fa-solid fa-certificate text-blue-600 mr-2"></i> Certifications
        </h2>
        <textarea id="certsInput" rows="2" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500" placeholder="Comma or newline separated certifications">COPC Certified Customer Experience Specialist, Six Sigma Yellow Belt (2022), Zendesk Support Administrator Certification</textarea>
      </div>

      <!-- Skills -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-sm mb-2 flex items-center">
          <i class="fa-solid fa-list-check text-blue-600 mr-2"></i> Skills & Tools
        </h2>
        <input type="text" id="skillsInput" value="Zendesk, Salesforce CRM, Avaya, Escalation Handling, CSAT Optimization, SLA Compliance, Team Coaching" oninput="updatePreview()" class="w-full text-xs p-2 border border-slate-300 rounded">
      </div>

    </div>

    <!-- MIDDLE COLUMN: Fitted Screen Canvas (5 cols) -->
    <div class="lg:col-span-5 flex flex-col items-center max-h-[calc(100vh-100px)] overflow-y-auto custom-scroll pr-1">
      <div class="w-full flex flex-col items-center">
        
        <div class="flex justify-between items-center mb-2 w-full px-2 sticky top-0 bg-slate-100 py-2 z-10">
          <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center">
            <i class="fa-solid fa-file-invoice text-blue-600 mr-1.5"></i> Live Canvas Preview
          </span>
          <span id="active-tpl-badge" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full border border-emerald-300 shadow-sm">
            Template #1
          </span>
        </div>

        <!-- Wrapper for canvas -->
        <div class="preview-viewport">
          <div id="resume-preview" class="a4-paper a4-screen-scaled rounded border border-slate-300 text-slate-800">
            <!-- Rendered dynamically -->
          </div>
        </div>

      </div>
    </div>

    <!-- RIGHT COLUMN: 100 Template Gallery (3 cols) -->
    <div class="lg:col-span-3">
      <div class="sticky top-20 bg-white p-4 rounded-xl shadow-sm border border-slate-200 max-h-[calc(100vh-100px)] flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-200 pb-2 mb-3">
          <h2 class="font-bold text-slate-800 text-sm flex items-center">
            <i class="fa-solid fa-palette text-blue-600 mr-2"></i> Template Gallery
          </h2>
          <span class="text-xs font-bold text-slate-400">100 Unique</span>
        </div>
        
        <!-- Search Input -->
        <input type="text" id="tplSearch" onkeyup="filterTemplates()" placeholder="Search template..." class="w-full text-xs p-2 mb-3 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">

        <!-- Scrollable Template Container -->
        <div id="template-gallery" class="custom-scroll overflow-y-auto space-y-2 pr-1 flex-1">
          <!-- 100 Template cards generated here -->
        </div>
      </div>
    </div>

  </main>

  <script>
    let selectedTplIndex = 1;

    const profilePhotos = [
      'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400',
      'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=400',
      'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400'
    ];

    let photoURL = profilePhotos[0];

    const colorSchemes = [
      { name: 'Emerald', bg: 'bg-emerald-900', text: 'text-emerald-900', border: 'border-emerald-800', accent: 'bg-emerald-600', light: 'bg-emerald-50' },
      { name: 'Maroon', bg: 'bg-rose-950', text: 'text-rose-950', border: 'border-rose-900', accent: 'bg-rose-700', light: 'bg-rose-50' },
      { name: 'Navy', bg: 'bg-slate-900', text: 'text-slate-900', border: 'border-slate-900', accent: 'bg-blue-600', light: 'bg-slate-100' },
      { name: 'Cyan Tech', bg: 'bg-cyan-900', text: 'text-cyan-900', border: 'border-cyan-600', accent: 'bg-cyan-600', light: 'bg-cyan-50' },
      { name: 'Indigo', bg: 'bg-indigo-900', text: 'text-indigo-900', border: 'border-indigo-800', accent: 'bg-indigo-600', light: 'bg-indigo-50' },
      { name: 'Teal Crest', bg: 'bg-teal-900', text: 'text-teal-900', border: 'border-teal-800', accent: 'bg-teal-600', light: 'bg-teal-50' },
      { name: 'Gold Navy', bg: 'bg-[#1a313b]', text: 'text-[#1a313b]', border: 'border-[#b38941]', accent: 'bg-[#b38941]', light: 'bg-amber-50' },
      { name: 'Purple Luxe', bg: 'bg-purple-950', text: 'text-purple-950', border: 'border-purple-800', accent: 'bg-purple-700', light: 'bg-purple-50' },
      { name: 'Slate Steel', bg: 'bg-slate-800', text: 'text-slate-800', border: 'border-slate-700', accent: 'bg-slate-600', light: 'bg-slate-100' },
      { name: 'Charcoal Dark', bg: 'bg-neutral-900', text: 'text-neutral-900', border: 'border-neutral-800', accent: 'bg-neutral-700', light: 'bg-neutral-100' }
    ];

    const layoutTypes = [
      'Split Sidebar Modern',       // 1 to 10
      'Top Modern Banner',          // 11 to 20
      'Two-Column Executive Grid',  // 21 to 30
      'Minimalist Line Art',        // 31 to 40
      'Technical Timeline',         // 41 to 50
      'Official Pinoy Bio-Data',    // 51 to 60
      'Modern BPO Operations',      // 61 to 70
      'Clean Corporate Banner',     // 71 to 80
      'Metro Compact 3-Column',     // 81 to 90
      'Bordered Executive Frame'    // 91 to 100
    ];

    function initGallery() {
      const gallery = document.getElementById('template-gallery');
      let html = '';

      for (let i = 1; i <= 100; i++) {
        const layoutIdx = Math.floor((i - 1) / 10);
        const colorIdx = (i - 1) % 10;
        
        const layoutName = layoutTypes[layoutIdx];
        const colorName = colorSchemes[colorIdx].name;
        const isSelected = i === selectedTplIndex;

        html += `
          <div onclick="switchTemplate(${i})" id="tpl-card-${i}" class="tpl-card cursor-pointer p-2.5 rounded-lg border transition hover:border-blue-400 ${isSelected ? 'border-2 border-emerald-600 bg-emerald-50/50 shadow-sm' : 'border-slate-200 bg-slate-50'}">
            <div class="flex justify-between items-center">
              <span class="font-bold text-xs text-slate-800">#${i}. ${layoutName}</span>
              ${isSelected ? `<span class="badge-active text-[9px] bg-emerald-600 text-white font-bold px-1.5 py-0.5 rounded">Active</span>` : ''}
            </div>
            <p class="text-[10px] text-slate-500 mt-0.5">Color: <span class="font-semibold text-slate-700">${colorName}</span></p>
          </div>
        `;
      }
      gallery.innerHTML = html;
    }

    function filterTemplates() {
      const query = document.getElementById('tplSearch').value.toLowerCase();
      document.querySelectorAll('.tpl-card').forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(query) ? 'block' : 'none';
      });
    }

    function switchTemplate(index) {
      selectedTplIndex = index;
      document.getElementById('active-tpl-badge').innerText = `Template #${index}`;

      document.querySelectorAll('.tpl-card').forEach((card, idx) => {
        const itemNum = idx + 1;
        const activeBadge = card.querySelector('.badge-active');
        if (activeBadge) activeBadge.remove();

        if (itemNum === index) {
          card.className = 'tpl-card cursor-pointer p-2.5 rounded-lg border-2 border-emerald-600 bg-emerald-50/50 shadow-sm transition';
          card.querySelector('div').innerHTML += `<span class="badge-active text-[9px] bg-emerald-600 text-white font-bold px-1.5 py-0.5 rounded">Active</span>`;
        } else {
          card.className = 'tpl-card cursor-pointer p-2.5 rounded-lg border border-slate-200 bg-slate-50 transition hover:border-blue-400';
        }
      });

      updatePreview();
    }

    function loadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoURL = e.target.result;
          updatePreview();
        };
        reader.readAsDataURL(file);
      }
    }

    function addExperienceBlock() {
      const container = document.getElementById('experience-container');
      const div = document.createElement('div');
      div.className = 'exp-card border border-slate-200 p-2.5 rounded-lg bg-slate-50 space-y-1.5';
      div.innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <input type="text" class="exp-company text-xs p-1 border border-slate-300 rounded" placeholder="Company" oninput="updatePreview()">
          <input type="text" class="exp-role text-xs p-1 border border-slate-300 rounded" placeholder="Role" oninput="updatePreview()">
        </div>
        <input type="text" class="exp-dates text-xs p-1 border border-slate-300 rounded w-full" placeholder="Dates" oninput="updatePreview()">
        <textarea class="exp-bullets text-xs p-1 border border-slate-300 rounded w-full" rows="2" placeholder="Responsibilities" oninput="updatePreview()"></textarea>
      `;
      container.appendChild(div);
    }

    function addEducationBlock() {
      const container = document.getElementById('education-container');
      const div = document.createElement('div');
      div.className = 'edu-card border border-slate-200 p-2.5 rounded-lg bg-slate-50 space-y-1.5';
      div.innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <input type="text" class="edu-school text-xs p-1 border border-slate-300 rounded" placeholder="School / University" oninput="updatePreview()">
          <input type="text" class="edu-degree text-xs p-1 border border-slate-300 rounded" placeholder="Degree" oninput="updatePreview()">
        </div>
        <input type="text" class="edu-dates text-xs p-1 border border-slate-300 rounded w-full" placeholder="Graduation Year / Dates" oninput="updatePreview()">
      `;
      container.appendChild(div);
    }

    function updatePreview() {
      const name = document.getElementById('fullName').value || 'Elena Rostova';
      const title = document.getElementById('jobTitle').value || 'Professional Title';
      const email = document.getElementById('email').value || 'email@example.com';
      const phone = document.getElementById('phone').value || '+63 900 000 0000';
      const address = document.getElementById('address').value || 'City, Country';
      const summary = document.getElementById('summary').value;
      const skillsRaw = document.getElementById('skillsInput').value;
      const certsRaw = document.getElementById('certsInput') ? document.getElementById('certsInput').value : '';

      // Bio-Data specific details
      const civilStatus = document.getElementById('civilStatus') ? document.getElementById('civilStatus').value : 'Single';
      const dob = document.getElementById('dob') ? document.getElementById('dob').value : 'August 14, 1993';
      const religion = document.getElementById('religion') ? document.getElementById('religion').value : 'Roman Catholic';
      const heightWeight = document.getElementById('heightWeight') ? document.getElementById('heightWeight').value : "5'5'' / 58 kg";

      const layoutGroup = Math.floor((selectedTplIndex - 1) / 10);
      const colorIdx = (selectedTplIndex - 1) % 10;
      const color = colorSchemes[colorIdx];

      // Build Work Experience HTML
      let expHTML = '';
      document.querySelectorAll('.exp-card').forEach(card => {
        const c = card.querySelector('.exp-company').value;
        const r = card.querySelector('.exp-role').value;
        const d = card.querySelector('.exp-dates').value;
        const b = card.querySelector('.exp-bullets').value;
        if (c || r) {
          let bHTML = '';
          if (b.trim() !== '') {
            const arr = b.split('\n').filter(x => x.trim() !== '');
            bHTML = `<ul class="list-disc list-inside text-xs text-slate-700 space-y-1 mt-1 font-normal">${arr.map(item => `<li>${item}</li>`).join('')}</ul>`;
          }
          expHTML += `
            <div class="mb-3">
              <div class="flex justify-between items-baseline">
                <h4 class="text-xs font-bold text-slate-900">${r}</h4>
                <span class="text-[10px] text-slate-500 font-medium">${d}</span>
              </div>
              <p class="text-xs font-semibold ${color.text} mb-1">${c}</p>
              ${bHTML}
            </div>
          `;
        }

        margin:       0,
        filename:     `${document.getElementById('fullName').value || 'Resume'} - Resumify.PH.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).toPdf().get('pdf').then(pdf => {
  if (pdf.internal.getNumberOfPages() > 1) {
    pdf.deletePage(2);
  }
  return pdf.save(`${document.getElementById('fullName').value || 'Resume'} - Resumify.PH.pdf`);
}).then(() => {
        // Re-apply screen scaled viewing class
        element.classList.add('a4-screen-scaled');
      }).catch(err => {
        element.classList.add('a4-screen-scaled');
        console.error('PDF Generation Error:', err);
      });
    }

    // Initial Load
    window.onload = function() {
      initGallery();
      updatePreview();
    };
  </script>
</body>
</html>
