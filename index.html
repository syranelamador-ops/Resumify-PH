<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumify PH - 100 A4 Resume & Bio-Data Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @media print {
      body * { visibility: hidden; }
      #resume-preview, #resume-preview * { visibility: visible; }
      #resume-preview { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; box-shadow: none; }
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    
    /* Strict A4 Aspect Ratio Canvas (210mm x 297mm) */
    .a4-paper {
      width: 100%;
      aspect-ratio: 1 / 1.4142;
      min-height: 842px;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white font-black px-3 py-1 rounded-lg text-xl tracking-wider">100</div>
        <div>
          <h1 class="font-extrabold text-xl leading-none">Resumify<span class="text-blue-400">.ph</span></h1>
          <p class="text-xs text-slate-400">100 Premium A4 Resume & Bio-Data Designs</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="triggerDownload()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center shadow-md">
          <i class="fa-solid fa-download mr-2"></i> Download A4 PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Main 3-Column Workspace -->
  <main class="max-w-[1500px] mx-auto px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
    
    <!-- LEFT COLUMN: Form Editor (4 cols) -->
    <div class="lg:col-span-4 space-y-6">
      
      <!-- Personal Details -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-base mb-4 flex items-center justify-between">
          <span class="flex items-center"><i class="fa-solid fa-user text-blue-600 mr-2"></i> Personal Details</span>
          <span class="text-[10px] text-slate-400 uppercase font-semibold">Live Editable</span>
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
            <input type="text" id="fullName" value="Michael Johnson" oninput="updatePreview()" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Target Job Title</label>
            <input type="text" id="jobTitle" value="Senior Sales & Operations Manager" oninput="updatePreview()" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
              <input type="email" id="email" value="michael.j@example.com" oninput="updatePreview()" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Phone</label>
              <input type="text" id="phone" value="+63 917 888 2345" oninput="updatePreview()" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Location</label>
            <input type="text" id="address" value="Makati City, Metro Manila" oninput="updatePreview()" class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Profile Photo</label>
            <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)" class="text-xs w-full p-1 border border-slate-300 rounded">
          </div>
        </div>

        <!-- Bio-Data Extra Fields -->
        <div id="biodata-extra-fields" class="mt-4 pt-4 border-t border-slate-200">
          <p class="text-xs font-bold text-amber-800 mb-2">Pinoy Bio-Data Details:</p>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-600">Civil Status</label>
              <input type="text" id="civilStatus" value="Married" oninput="updatePreview()" class="w-full text-sm p-1.5 border border-slate-300 rounded">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-600">Date of Birth</label>
              <input type="text" id="dob" value="August 14, 1990" oninput="updatePreview()" class="w-full text-sm p-1.5 border border-slate-300 rounded">
            </div>
            <div class="col-span-2">
              <label class="block text-[11px] font-semibold text-slate-600">Religion</label>
              <input type="text" id="religion" value="Roman Catholic" oninput="updatePreview()" class="w-full text-sm p-1.5 border border-slate-300 rounded">
            </div>
          </div>
        </div>
      </div>

      <!-- Professional Summary -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-base mb-2 flex items-center">
          <i class="fa-solid fa-pen-nib text-blue-600 mr-2"></i> Professional Summary
        </h2>
        <textarea id="summary" rows="4" oninput="updatePreview()" class="w-full text-sm p-2.5 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500">A results-driven Senior Manager with over 8 years of executive leadership in commercial enterprise sales, strategic operations, and key partner management. Skilled in scaling operations, leading multi-functional teams, and consistently surpassing revenue targets in competitive markets.</textarea>
      </div>

      <!-- Experience -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-slate-800 text-base flex items-center">
            <i class="fa-solid fa-briefcase text-blue-600 mr-2"></i> Work Experience
          </h2>
          <button onclick="addExperienceBlock()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded border border-blue-200">
            <i class="fa-solid fa-plus mr-1"></i> Add Position
          </button>
        </div>

        <div id="experience-container" class="space-y-4">
          <div class="exp-card border border-slate-200 p-3 rounded-lg bg-slate-50 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" class="exp-company text-sm p-1.5 border border-slate-300 rounded" value="Global Apex Logistics" placeholder="Company" oninput="updatePreview()">
              <input type="text" class="exp-role text-sm p-1.5 border border-slate-300 rounded" value="Senior Operations Manager" placeholder="Role" oninput="updatePreview()">
            </div>
            <input type="text" class="exp-dates text-sm p-1.5 border border-slate-300 rounded w-full" value="2021 - Present" placeholder="Dates" oninput="updatePreview()">
            <textarea class="exp-bullets text-sm p-1.5 border border-slate-300 rounded w-full" rows="3" placeholder="Responsibilities" oninput="updatePreview()">Directly managed standard operations for 45 enterprise accounts across Southeast Asia.
Boosted total regional quarterly profit margin by 28% through supply chain optimization.
Mentored and led an agile high-performing workforce of 14 account managers.</textarea>
          </div>

          <div class="exp-card border border-slate-200 p-3 rounded-lg bg-slate-50 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" class="exp-company text-sm p-1.5 border border-slate-300 rounded" value="Metro Commercial Inc." placeholder="Company" oninput="updatePreview()">
              <input type="text" class="exp-role text-sm p-1.5 border border-slate-300 rounded" value="Account Lead Associate" placeholder="Role" oninput="updatePreview()">
            </div>
            <input type="text" class="exp-dates text-sm p-1.5 border border-slate-300 rounded w-full" value="2017 - 2021" placeholder="Dates" oninput="updatePreview()">
            <textarea class="exp-bullets text-sm p-1.5 border border-slate-300 rounded w-full" rows="2" placeholder="Responsibilities" oninput="updatePreview()">Expanded client retention rates to 94% through personalized CRM strategies.
Coordinated quarterly trade shows resulting in 500+ corporate leads.</textarea>
          </div>
        </div>
      </div>

      <!-- Skills -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 text-base mb-2 flex items-center">
          <i class="fa-solid fa-list-check text-blue-600 mr-2"></i> Skills & Expertise
        </h2>
        <input type="text" id="skillsInput" value="Strategic Planning, Revenue Expansion, Client Acquisition, Agile Leadership, Data Analytics, Commercial Negotiation" oninput="updatePreview()" class="w-full text-sm p-2 border border-slate-300 rounded">
      </div>

    </div>

    <!-- MIDDLE COLUMN: Live Preview Canvas (5 cols) -->
    <div class="lg:col-span-5 flex flex-col items-center">
      <div class="sticky top-20 w-full max-w-[620px]">
        
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center">
            <i class="fa-solid fa-file-invoice text-blue-600 mr-1.5"></i> Full A4 Live Canvas
          </span>
          <span id="active-tpl-badge" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full border border-emerald-300 shadow-sm">
            Template #1
          </span>
        </div>

        <!-- Live Document Paper -->
        <div id="resume-preview" class="a4-paper rounded border border-slate-300 overflow-hidden text-slate-800">
          <!-- Rendered dynamically -->
        </div>

      </div>
    </div>

    <!-- RIGHT COLUMN: 100 Template Gallery (3 cols) -->
    <div class="lg:col-span-3">
      <div class="sticky top-20 bg-white p-4 rounded-xl shadow-sm border border-slate-200 max-h-[calc(100vh-100px)] flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-200 pb-2 mb-3">
          <h2 class="font-bold text-slate-800 text-sm flex items-center">
            <i class="fa-solid fa-palette text-blue-600 mr-2"></i> Template Gallery
          </h2>
          <span class="text-xs font-bold text-slate-400">100 Designs</span>
        </div>
        
        <!-- Search Input -->
        <input type="text" id="tplSearch" onkeyup="filterTemplates()" placeholder="Search #, color, style..." class="w-full text-xs p-2 mb-3 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">

        <!-- Scrollable Template Container -->
        <div id="template-gallery" class="custom-scroll overflow-y-auto space-y-2 pr-1 flex-1">
          <!-- 100 Template cards generated here -->
        </div>
      </div>
    </div>

  </main>

  <script>
    let selectedTplIndex = 1;

    // Headshots array to assign realistic profile photos
    const profilePhotos = [
      'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=300',
      'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=300',
      'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300',
      'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=300',
      'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300',
      'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=300',
      'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&q=80&w=300'
    ];

    let photoURL = profilePhotos[0];

    // Color Palettes
    const colorSchemes = [
      { name: 'Emerald', primary: 'bg-emerald-900', text: 'text-emerald-900', border: 'border-emerald-800', accent: 'bg-emerald-600', light: 'bg-emerald-50' },
      { name: 'Maroon', primary: 'bg-rose-950', text: 'text-rose-950', border: 'border-rose-900', accent: 'bg-rose-700', light: 'bg-rose-50' },
      { name: 'Navy', primary: 'bg-slate-900', text: 'text-slate-900', border: 'border-slate-900', accent: 'bg-blue-600', light: 'bg-slate-100' },
      { name: 'Cyan Tech', primary: 'bg-cyan-900', text: 'text-cyan-900', border: 'border-cyan-600', accent: 'bg-cyan-600', light: 'bg-cyan-50' },
      { name: 'Indigo', primary: 'bg-indigo-900', text: 'text-indigo-900', border: 'border-indigo-800', accent: 'bg-indigo-600', light: 'bg-indigo-50' },
      { name: 'Teal Crest', primary: 'bg-teal-900', text: 'text-teal-900', border: 'border-teal-800', accent: 'bg-teal-600', light: 'bg-teal-50' },
      { name: 'Gold Navy', primary: 'bg-[#1a313b]', text: 'text-[#1a313b]', border: 'border-[#b38941]', accent: 'bg-[#b38941]', light: 'bg-amber-50' },
      { name: 'Purple Luxe', primary: 'bg-purple-950', text: 'text-purple-950', border: 'border-purple-800', accent: 'bg-purple-700', light: 'bg-purple-50' },
      { name: 'Slate Steel', primary: 'bg-slate-800', text: 'text-slate-800', border: 'border-slate-700', accent: 'bg-slate-600', light: 'bg-slate-100' },
      { name: 'Classic BioData', primary: 'bg-slate-900', text: 'text-slate-900', border: 'border-slate-900', accent: 'bg-slate-800', light: 'bg-slate-50' }
    ];

    // Layout Models
    const layoutNames = [
      'Emerald Sidebar', 'Executive Split', 'Tech Stack Pills', 
      'Progress Bars', 'Gold Ribbon Crest', 'Official Pinoy Bio-Data', 
      'Modern BPO Header', 'Minimal Top Banner', 'Compact Grid', 'Bordered Frame'
    ];

    // Preset Profiles for Auto-Filling rich samples
    const presetProfiles = [
      { name: "Michael Johnson", title: "Senior Sales & Operations Manager", summary: "A results-driven Senior Manager with over 8 years of executive leadership in commercial enterprise sales, strategic operations, and key partner management." },
      { name: "Elena Rostova", title: "Executive Director of Marketing", summary: "Visionary Brand Strategist and Marketing Executive with 10+ years driving omnichannel campaigns across global FMCG brands." },
      { name: "Nicholas Koe", title: "Lead Full-Stack Software Engineer", summary: "Innovative Full-Stack Engineer with 7 years of expertise building scalable cloud applications, high-throughput microservices, and web applications." },
      { name: "Olivia Martinez", title: "Senior UI/UX & Product Designer", summary: "Detail-oriented Product Designer creating intuitive user experiences for Fintech and E-commerce platforms. Specialized in design systems and interactive prototyping." },
      { name: "Larry Tibbetts", title: "Chief Financial & Investment Analyst", summary: "Senior Financial Consultant with extensive background in portfolio risk evaluation, corporate valuations, and capital allocation." },
      { name: "Juan De La Cruz", title: "Administrative Support Officer", summary: "Reliable Administrative Assistant with 4+ years of dedicated service in records management, office logistics, and correspondence processing." },
      { name: "Samantha Raye", title: "BPO Operations Team Lead", summary: "Dynamic Call Center Team Lead with 6+ years managing high-volume international US sales & customer care accounts." }
    ];

    function initGallery() {
      const gallery = document.getElementById('template-gallery');
      let html = '';
      let count = 1;

      for (let l = 0; l < 10; l++) {
        for (let c = 0; c < 10; c++) {
          const color = colorSchemes[c];
          const layout = layoutNames[l];
          const isFirst = count === 1;

          html += `
            <div onclick="switchTemplate(${count})" id="tpl-card-${count}" class="tpl-card cursor-pointer p-2.5 rounded-lg border transition hover:border-blue-400 ${isFirst ? 'border-2 border-emerald-600 bg-emerald-50/50 shadow-sm' : 'border-slate-200 bg-slate-50'}">
              <div class="flex justify-between items-center">
                <span class="font-bold text-xs text-slate-800">#${count}. ${color.name} ${layout}</span>
                ${isFirst ? `<span class="badge-active text-[9px] bg-emerald-600 text-white font-bold px-1.5 py-0.5 rounded">Active</span>` : ''}
              </div>
              <p class="text-[10px] text-slate-500 mt-0.5">Style: ${layout} • ${color.name} Palette</p>
            </div>
          `;
          count++;
        }
      }
      gallery.innerHTML = html;
    }

    function switchTemplate(index) {
      selectedTplIndex = index;
      document.getElementById('active-tpl-badge').innerText = `Template #${index}`;

      document.querySelectorAll('.tpl-card').forEach((card, idx) => {
        const itemNum = idx + 1;
        const activeBadge = card.querySelector('.badge-active');
        if (activeBadge) activeBadge.remove();

        if (itemNum === index) {
          card.className = 'tpl-card cursor-pointer p-2.5 rounded-lg border-2 border-emerald-600 bg-emerald-50/50 shadow-sm transition';
          card.querySelector('div').innerHTML += `<span class="badge-active text-[9px] bg-emerald-600 text-white font-bold px-1.5 py-0.5 rounded">Active</span>`;
        } else {
          card.className = 'tpl-card cursor-pointer p-2.5 rounded-lg border border-slate-200 bg-slate-50 transition hover:border-blue-400';
        }
      });

      // Swap preset profile & headshots dynamically
      const profile = presetProfiles[(index - 1) % presetProfiles.length];
      photoURL = profilePhotos[(index - 1) % profilePhotos.length];

      document.getElementById('fullName').value = profile.name;
      document.getElementById('jobTitle').value = profile.title;
      document.getElementById('summary').value = profile.summary;

      updatePreview();
    }

    function loadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoURL = e.target.result;
          updatePreview();
        };
        reader.readAsDataURL(file);
      }
    }

    function updatePreview() {
      const name = document.getElementById('fullName').value || 'Michael Johnson';
      const title = document.getElementById('jobTitle').value || 'Professional Title';
      const email = document.getElementById('email').value || 'email@example.com';
      const phone = document.getElementById('phone').value || '+63 900 000 0000';
      const address = document.getElementById('address').value || 'City, Country';
      const summary = document.getElementById('summary').value;
      const skillsRaw = document.getElementById('skillsInput').value;

      const layoutIdx = Math.floor((selectedTplIndex - 1) / 10);
      const colorIdx = (selectedTplIndex - 1) % 10;
      const color = colorSchemes[colorIdx];

      let expHTML = '';
      document.querySelectorAll('.exp-card').forEach(card => {
        const c = card.querySelector('.exp-company').value;
        const r = card.querySelector('.exp-role').value;
        const d = card.querySelector('.exp-dates').value;
        const b = card.querySelector('.exp-bullets').value;
        if (c || r) {
          let bHTML = '';
          if (b.trim() !== '') {
            const arr = b.split('\n').filter(x => x.trim() !== '');
            bHTML = `<ul class="list-disc list-inside text-xs text-slate-700 space-y-1 mt-1 font-normal">${arr.map(item => `<li>${item}</li>`).join('')}</ul>`;
          }
          expHTML += `
            <div class="mb-4">
              <div class="flex justify-between items-baseline">
                <h4 class="text-sm font-bold text-slate-900">${r}</h4>
                <span class="text-xs text-slate-500 font-medium">${d}</span>
              </div>
              <p class="text-xs font-semibold ${color.text} mb-1">${c}</p>
              ${bHTML}
            </div>
          `;
        }
      });

      const skillsArr = skillsRaw.split(',').filter(s => s.trim() !== '');
      const previewBox = document.getElementById('resume-preview');

      // LAYOUT 0: Emerald/Sidebar Style
      if (layoutIdx === 0) {
        const skillsPill = skillsArr.map(s => `<span class="block border border-white/40 bg-white/10 text-white rounded-lg px-2.5 py-1 text-xs text-center mb-1.5">${s.trim()}</span>`).join('');
        previewBox.innerHTML = `
          <div class="grid grid-cols-12 min-h-[842px]">
            <div class="col-span-4 ${color.primary} text-white p-5 space-y-5 flex flex-col justify-between">
              <div class="space-y-5">
                <div class="text-center pt-2">
                  <img src="${photoURL}" class="w-24 h-24 rounded-full mx-auto mb-3 border-4 border-white/60 shadow-md object-cover">
                  <h2 class="font-extrabold text-base uppercase tracking-wider">${name}</h2>
                  <p class="text-xs opacity-90 mt-1 font-light">${title}</p>
                </div>
                <div>
                  <h3 class="text-xs font-bold uppercase border-b border-white/30 pb-1.5 mb-2.5 text-white tracking-wider">Contact Info</h3>
                  <div class="text-xs space-y-2 opacity-90">
                    <p><i class="fa-solid fa-location-dot mr-1.5"></i> ${address}</p>
                    <p><i class="fa-solid fa-phone mr-1.5"></i> ${phone}</p>
                    <p><i class="fa-solid fa-envelope mr-1.5"></i> ${email}</p>
                  </div>
                </div>
                <div>
                  <h3 class="text-xs font-bold uppercase border-b border-white/30 pb-1.5 mb-2.5 text-white tracking-wider">Core Skills</h3>
                  ${skillsPill}
                </div>
              </div>
            </div>
            <div class="col-span-8 p-7 space-y-6 bg-white">
              <div>
                <h3 class="text-xs font-bold uppercase ${color.text} border-b-2 ${color.border} pb-1 mb-2.5 tracking-wider">Executive Summary</h3>
                <p class="text-xs text-slate-700 leading-relaxed">${summary}</p>
              </div>
              <div>
                <h3 class="text-xs font-bold uppercase ${color.text} border-b-2 ${color.border} pb-1 mb-3.5 tracking-wider">Professional Work Experience</h3>
                ${expHTML}
              </div>
            </div>
          </div>`;
      } 
      // LAYOUT 3: Progress Bars
      else if (layoutIdx === 3) {
        const skillBars = skillsArr.map(s => `
          <div class="mb-2.5">
            <div class="flex justify-between text-xs text-slate-700 font-semibold mb-1">
              <span>${s.trim()}</span>
              <span class="${color.text} font-bold">90%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-1.5"><div class="${color.accent} h-1.5 rounded-full" style="width: 90%"></div></div>
          </div>`).join('');
        previewBox.innerHTML = `
          <div class="p-8 space-y-6 min-h-[842px] bg-white">
            <div class="flex justify-between items-center border-b-2 border-slate-100 pb-5">
              <div class="space-y-1">
                <h1 class="text-2xl font-extrabold text-slate-900">${name}</h1>
                <p class="text-xs font-bold ${color.text} uppercase tracking-widest">${title}</p>
                <p class="text-xs text-slate-500 pt-1">${address} • ${phone} • ${email}</p>
              </div>
              <img src="${photoURL}" class="w-20 h-20 rounded-full object-cover border-2 ${color.border} shadow-md">
            </div>
            <div>
              <h3 class="text-xs font-bold uppercase ${color.text} border-b pb-1 mb-2 tracking-wider">Profile Statement</h3>
              <p class="text-xs text-slate-700 leading-relaxed">${summary}</p>
            </div>
            <div>
              <h3 class="text-xs font-bold uppercase ${color.text} border-b pb-1 mb-3 tracking-wider">Skills Visualizer</h3>
              <div class="grid grid-cols-2 gap-x-6">${skillBars}</div>
            </div>
            <div>
              <h3 class="text-xs font-bold uppercase ${color.text} border-b pb-1 mb-3 tracking-wider">Work Experience</h3>
              ${expHTML}
            </div>
          </div>`;
      }
      // LAYOUT 5: Official Pinoy Bio-Data
      else if (layoutIdx === 5) {
        const civil = document.getElementById('civilStatus').value || 'Single';
        const dob = document.getElementById('dob').value || 'Jan 15, 1995';
        const religion = document.getElementById('religion').value || 'Roman Catholic';
        previewBox.innerHTML = `
          <div class="p-8 min-h-[842px] bg-white flex flex-col justify-between">
            <div class="space-y-5">
              <div class="border-b-4 border-slate-900 pb-4 flex justify-between items-center">
                <div>
                  <h1 class="text-2xl font-black uppercase tracking-widest text-slate-900">PERSONAL BIO-DATA</h1>
                  <h2 class="text-lg font-bold text-slate-800 mt-1">${name}</h2>
                  <p class="text-xs font-bold text-blue-800 uppercase tracking-wider">${title}</p>
                </div>
                <div class="w-24 h-24 border-2 border-slate-900 p-1 bg-white shadow-sm flex items-center justify-center">
                  <img src="${photoURL}" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="bg-slate-50 border-2 border-slate-800 p-4 rounded text-xs space-y-2">
                <p class="font-bold border-b border-slate-300 pb-1 text-slate-900 uppercase">Personal Information Record:</p>
                <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-slate-800">
                  <p><strong>Mobile No:</strong> ${phone}</p>
                  <p><strong>Email:</strong> ${email}</p>
                  <p><strong>Address:</strong> ${address}</p>
                  <p><strong>Date of Birth:</strong> ${dob}</p>
                  <p><strong>Civil Status:</strong> ${civil}</p>
                  <p><strong>Religion:</strong> ${religion}</p>
                </div>
              </div>
              <div>
                <h3 class="text-xs font-bold uppercase border-b-2 border-slate-800 pb-1 mb-2 text-slate-900 tracking-wider">Qualifications</h3>
                <p class="text-xs text-slate-700 leading-relaxed">${summary}</p>
              </div>
              <div>
                <h3 class="text-xs font-bold uppercase border-b-2 border-slate-800 pb-1 mb-3 text-slate-900 tracking-wider">Employment History</h3>
                ${expHTML}
              </div>
            </div>
            <div class="pt-8 flex justify-between items-end">
              <div class="text-[10px] text-slate-400">I hereby certify that the above information is true and correct.</div>
              <div class="text-center w-48 border-t border-slate-800 pt-1 text-xs font-bold text-slate-800">
                Applicant Signature
              </div>
            </div>
          </div>`;
      }
      // DEFAULT LAYOUT: Top Banner & Cards
      else {
        const skillsBadges = skillsArr.map(s => `<span class="${color.accent} text-white font-medium px-2.5 py-1 rounded text-xs inline-block mb-1 shadow-sm">${s.trim()}</span>`).join(' ');
        previewBox.innerHTML = `
          <div class="p-8 space-y-6 min-h-[842px] bg-slate-50/50 flex flex-col justify-between">
            <div class="space-y-6">
              <div class="flex justify-between items-center ${color.primary} text-white p-6 rounded-xl shadow-md">
                <div class="space-y-1">
                  <h1 class="text-2xl font-black tracking-wide">${name}</h1>
                  <p class="text-xs font-semibold tracking-wider uppercase opacity-90">${title}</p>
                  <p class="text-[11px] opacity-80 pt-2"><i class="fa-solid fa-envelope mr-1"></i> ${email} • <i class="fa-solid fa-phone mr-1"></i> ${phone} • <i class="fa-solid fa-location-dot mr-1"></i> ${address}</p>
                </div>
                <img src="${photoURL}" class="w-20 h-20 rounded-xl object-cover border-2 border-white/60 shadow">
              </div>
              <div>
                <h3 class="text-xs font-bold ${color.text} uppercase border-b-2 ${color.border} pb-1 mb-2 tracking-wider">About Me</h3>
                <p class="text-xs text-slate-700 leading-relaxed">${summary}</p>
              </div>
              <div class="grid grid-cols-12 gap-6">
                <div class="col-span-7 space-y-3">
                  <h3 class="text-xs font-bold ${color.text} uppercase border-b-2 ${color.border} pb-1 tracking-wider">Experience</h3>
                  ${expHTML}
                </div>
                <div class="col-span-5 space-y-3">
                  <h3 class="text-xs font-bold ${color.text} uppercase border-b-2 ${color.border} pb-1 tracking-wider">Skills & Capabilities</h3>
                  <div class="flex flex-wrap gap-1.5 pt-1">${skillsBadges}</div>
                </div>
              </div>
            </div>
          </div>`;
      }
    }

    function filterTemplates() {
      const query = document.getElementById('tplSearch').value.toLowerCase();
      document.querySelectorAll('.tpl-card').forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(query) ? 'block' : 'none';
      });
    }

    function addExperienceBlock() {
      const container = document.getElementById('experience-container');
      const div = document.createElement('div');
      div.className = 'exp-card border border-slate-200 p-3 rounded-lg bg-slate-50 relative space-y-2';
      div.innerHTML = `
        <button onclick="this.parentElement.remove(); updatePreview();" class="absolute top-1 right-2 text-xs text-red-500 font-bold px-1 py-0.5">
          <i class="fa-solid fa-trash mr-1"></i> Remove
        </button>
        <div class="grid grid-cols-2 gap-2 pt-2">
          <input type="text" class="exp-company text-sm p-1.5 border border-slate-300 rounded" placeholder="Company Name" oninput="updatePreview()">
          <input type="text" class="exp-role text-sm p-1.5 border border-slate-300 rounded" placeholder="Role" oninput="updatePreview()">
        </div>
        <input type="text" class="exp-dates text-sm p-1.5 border border-slate-300 rounded w-full" placeholder="Dates" oninput="updatePreview()">
        <textarea class="exp-bullets text-sm p-1.5 border border-slate-300 rounded w-full" rows="2" placeholder="Responsibilities (1 per line)" oninput="updatePreview()"></textarea>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function triggerDownload() {
      const element = document.getElementById('resume-preview');
      const name = document.getElementById('fullName').value || 'Resume';
      const opt = {
        margin: 0,
        filename: `${name.replace(/\s+/g, '_')}_A4_Resume.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    window.onload = function() {
      initGallery();
      updatePreview();
    };
  </script>
</body>
</html>
